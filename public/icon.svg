<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#141312"/>
  <rect x="24" y="24" width="464" height="464" fill="none" stroke="#4E563E" stroke-width="2" opacity="0.6"/>
  <!-- Elegant Diran Wears Interlocking Monogram -->
  <g transform="translate(106, 116)">
    <!-- Letter D -->
    <path d="M 40 40 L 40 240 L 140 240 C 200 240 230 190 230 140 C 230 90 200 40 140 40 Z" 
          fill="none" 
          stroke="#FAF7F2" 
          stroke-width="18" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    <!-- Letter W overlapping -->
    <path d="M 120 100 L 150 240 L 200 120 L 250 240 L 280 100" 
          fill="none" 
          stroke="#9BAA7C" 
          stroke-width="16" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>
  <text x="256" y="420" font-family="'Instrument Serif', Georgia, serif" font-size="34" font-weight="bold" letter-spacing="8" fill="#FAF7F2" text-anchor="middle">DIRAN WEARS</text>
  <text x="256" y="448" font-family="'Inter', sans-serif" font-size="14" letter-spacing="6" fill="#9BAA7C" text-anchor="middle">LAGOS ATELIER</text>
</svg>
